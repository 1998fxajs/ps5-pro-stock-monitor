name: Test Telegram notification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/test-telegram.yml
      - live_validation.py
permissions:
  contents: read
jobs:
  send-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test parsers and notification failure handling
        run: python3 -m unittest discover -v
      - name: Verify public sources and send labelled historical replay
        run: python3 -u live_validation.py
        env:
          SEND_TEST_ALERT: '1'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Retain live validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-validation
          path: validation-summary.json
          if-no-files-found: warn

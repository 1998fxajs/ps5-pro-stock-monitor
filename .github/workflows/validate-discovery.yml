name: Validate PS5 Pro discovery configuration
on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '**.json'
      - promo_watch.py
      - test_promo_watch.py
      - sale_link_review.py
      - test_sale_link_review.py
      - raffle_watch.py
      - test_raffle_watch.py
      - retail_watch.py
      - test_retail_watch.py
      - .github/workflows/validate-discovery.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Test promotion keyword and PlayShop search coverage
        run: python3 -m unittest discover -v
      - name: Confirm official marketplace products and preserve own-site exclusion
        run: |
          python3 - <<'PY'
          import retail_watch, catalog_watch
          from urllib.parse import urlsplit
          stores = retail_watch.STORES + catalog_watch.STORE_LISTS
          assert all(urlsplit(s['url']).hostname not in ('playshop.co.kr', 'www.playshop.co.kr', 'ojinplaystation.cafe24.com') for s in stores)
          ids = {s['id'] for s in retail_watch.STORES}
          assert {'gmarket_playshop', 'naver_playshop', 'coupang_reported'} <= ids, ids
          print('Official Gmarket/Naver product pages registered; own-site inventory exclusion preserved')
          PY

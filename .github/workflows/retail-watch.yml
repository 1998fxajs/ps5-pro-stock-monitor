name: PS5 Pro retailer stock monitor
on:
  schedule:
    - cron: '1-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ps5-pro-retail-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Monitor three retailer product pages
        run: python3 retail_watch.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

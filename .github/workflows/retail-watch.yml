name: PS5 Pro retailer stock monitor
on:
  schedule:
    # Start one long-running monitoring runner each hour, away from :00 load.
    # The process itself checks every ~5 minutes while a runner is active.
    - cron: '13 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - retail_watch.py
      - watch_loop.py
      - monitor_window.py
      - test_retail_watch.py
      - test_watch_loop.py
      - .github/workflows/retail-watch.yml
permissions:
  contents: write
  actions: write
concurrency:
  group: ps5-pro-retail-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 155
    steps:
      - uses: actions/checkout@v4
      - name: Check monitoring deadline (Nov 19 KST)
        id: window
        run: python3 monitor_window.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILENAME: retail-watch.yml
      - name: Run stock and loop tests
        if: steps.window.outputs.active == 'true'
        run: python3 -m unittest test_retail_watch.py test_watch_loop.py -v
      - name: Poll retailers every five minutes while runner is active
        if: steps.window.outputs.active == 'true'
        run: python3 -u watch_loop.py retail --duration-minutes "$DURATION_MINUTES"
        env:
          DURATION_MINUTES: '140'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

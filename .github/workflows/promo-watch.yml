name: PS5 Pro promotion and new listing discovery
on:
  schedule:
    # Hourly restart requests; inside each active job, poll every ~5 minutes.
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - promo_watch.py
      - sale_link_review.py
      - post_content.py
      - image_ocr.py
      - test_context_review.py
      - validate_context_live.py
      - test_sale_link_review.py
      - catalog_watch.py
      - dcinside_watch.py
      - watch_loop.py
      - monitor_window.py
      - notifications.py
      - community_language.json
      - source_registry.json
      - web_discovery.py
      - test_incident_regressions.py
      - test_promo_watch.py
      - test_catalog_watch.py
      - test_dcinside_watch.py
      - test_watch_loop.py
      - .github/workflows/promo-watch.yml
permissions:
  contents: write
  actions: write
concurrency:
  group: ps5-pro-promo-watch
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 155
    env:
      MONITOR_DRY_RUN: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check monitoring deadline (Nov 19 KST)
        id: window
        run: python3 monitor_window.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILENAME: promo-watch.yml
      - name: Verify announcement, listing, DC, and loop parsers
        if: steps.window.outputs.active == 'true'
        run: python3 -m unittest discover -v
      - name: Install free Korean and English image OCR
        if: steps.window.outputs.active == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-kor
      - name: Read current posts and replay historical images without sending
        if: steps.window.outputs.active == 'true' && env.MONITOR_DRY_RUN == '1'
        run: python3 -u validate_context_live.py
      - name: Poll new sale posts and product listings every five minutes
        if: steps.window.outputs.active == 'true'
        run: python3 -u watch_loop.py promo --duration-minutes "$DURATION_MINUTES"
        env:
          DURATION_MINUTES: '140'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Retain context validation evidence
        if: always() && env.MONITOR_DRY_RUN == '1'
        uses: actions/upload-artifact@v4
        with:
          name: context-validation
          path: context-validation.json
          if-no-files-found: warn

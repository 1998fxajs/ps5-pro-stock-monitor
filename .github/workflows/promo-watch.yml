name: PS5 Pro promotion discovery
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - promo_watch.py
      - test_promo_watch.py
      - .github/workflows/promo-watch.yml
permissions:
  contents: write
concurrency:
  group: ps5-pro-promo-watch
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Run announcement keyword tests
        run: python3 -m unittest test_promo_watch.py -v
      - name: Discover newly announced deals and lotteries
        run: python3 promo_watch.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
